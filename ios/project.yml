name: MYSystem
options:
  bundleIdPrefix: com.mysystem
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  MYSystem:
    type: application
    platform: iOS
    sources:
      - path: MYSystemApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysystem.app
        INFOPLIST_KEY_CFBundleDisplayName: MY SYSTEM
        INFOPLIST_KEY_LSApplicationQueriesSchemes: mysystem
        INFOPLIST_KEY_CFBundleURLTypes:
          - CFBundleURLSchemes:
              - mysystem
    entitlements:
      path: MYSystemApp/MYSystem.entitlements
  MYSystemWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MYSystemWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysystem.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: MY SYSTEM
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MYSystemWidget/MYSystemWidget.entitlements
    dependencies:
      - target: MYSystem
