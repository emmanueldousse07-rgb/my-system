name: MYSystem
options:
  bundleIdPrefix: com.mysystem
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  MYSystem:
    type: application
    platform: iOS
    sources:
      - path: MYSystemApp
    info:
      path: MYSystemApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysystem.app
    entitlements:
      path: MYSystemApp/MYSystem.entitlements
  MYSystemWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MYSystemWidget
    info:
      path: MYSystemWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysystem.app.widget
    entitlements:
      path: MYSystemWidget/MYSystemWidget.entitlements
    dependencies:
      - target: MYSystem
